# Sveltia CMS configuration. Keep every collection in sync with
# src/lib/content/schemas.ts (guarded by tests/unit/admin/config-parity.test.ts).
backend:
  name: github
  repo: Jhomove/jhomovedev # TODO(autor): confirm owner/repo
  branch: main

media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_folders
  locales: [es, en]
  default_locale: es

collections:
  - name: stack
    label: Stack
    label_singular: Technology
    folder: src/content/stack
    extension: json
    format: json
    create: true
    i18n: false
    fields:
      - { name: name, label: Name, widget: string }
      - name: cluster
        label: Cluster
        widget: select
        options:
          - frontend
          - backend
          - aws-serverless
          - data
          - devops-iac
          - ai
          - languages
          - tools
      - {
          name: years,
          label: Years of experience,
          widget: number,
          value_type: float,
          min: 0,
          required: false,
        }
      - { name: icon, label: Icon key, widget: string, required: false }
      - { name: order, label: Order, widget: number, value_type: int, required: false }

  # Per-locale singletons: Sveltia replaces {{locale}} in the file path (es.json / en.json)
  # and requires both the collection and each file to declare i18n.
  - name: settings
    label: Site settings
    i18n: true
    files:
      - name: profile
        label: Profile
        file: src/content/profile/{{locale}}.json
        i18n: true
        fields:
          - { name: name, label: Name, widget: string, i18n: duplicate }
          - { name: brand, label: Brand, widget: string, i18n: duplicate }
          - { name: headline, label: Headline, widget: string, i18n: true }
          - { name: bio, label: Bio, widget: text, i18n: true }
          - { name: location, label: Location, widget: string, i18n: true }
          - { name: remote, label: Open to remote work, widget: boolean, i18n: duplicate }
          - {
              name: yearsExperience,
              label: Years of experience,
              widget: number,
              value_type: int,
              min: 1,
              i18n: duplicate,
            }
          - name: availability
            label: Availability (not shown on the site yet)
            widget: select
            options:
              - open-to-offers
              - freelance
              - not-available
            i18n: duplicate
          # Sveltia 0.245: items of a translatable list can only be added in the default locale,
          # and the other locale does not follow. Keep es.json and en.json item counts equal.
          - name: languages
            label: Languages
            widget: list
            i18n: true
            fields:
              - { name: name, label: Language, widget: string }
              - { name: level, label: Level, widget: string }
          - name: contact
            label: Contact
            widget: object
            i18n: duplicate
            fields:
              - { name: email, label: Email, widget: string }
              - { name: linkedin, label: LinkedIn URL, widget: string }
              - { name: whatsapp, label: WhatsApp link, widget: string, required: false }
          - name: seo
            label: SEO
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
      - name: media
        label: Media
        file: src/content/media/{{locale}}.json
        i18n: true
        fields:
          - { name: cv, label: CV (PDF), widget: file, required: false, i18n: true }
          - { name: ogImage, label: Social share image, widget: image, required: false, i18n: true }

  - name: leadership
    label: Path to Tech Lead
    label_singular: Milestone
    folder: src/content/leadership
    extension: json
    format: json
    create: true
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: evidence, label: Evidence, widget: text, i18n: true }
      - {
          name: date,
          label: Date (YYYY-MM or YYYY),
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - { name: link, label: Evidence link, widget: string, required: false, i18n: duplicate }
      - { name: order, label: Order, widget: number, value_type: int, i18n: duplicate }

  # One Markdown file per locale; no body, everything lives in the front matter. `achievements` is a
  # single translatable Markdown field (a bullet list) because Sveltia 0.245 cannot add items to a
  # translatable list outside the default locale.
  - name: experience
    label: Experience
    label_singular: Role
    folder: src/content/experience
    extension: md
    format: frontmatter
    create: true
    i18n: true
    identifier_field: company
    fields:
      - { name: role, label: Role, widget: string, i18n: true }
      - { name: company, label: Company, widget: string, i18n: duplicate }
      - { name: location, label: Location, widget: string, i18n: duplicate }
      - { name: start, label: Start (YYYY-MM), widget: string, i18n: duplicate }
      - { name: end, label: End (YYYY-MM or "present"), widget: string, i18n: duplicate }
      - {
          name: achievements,
          label: Achievements (Markdown bullet list),
          widget: markdown,
          i18n: true,
        }
      - name: stack
        label: Stack
        widget: relation
        collection: stack
        search_fields: [name]
        value_field: '{{slug}}'
        display_fields: [name]
        multiple: true
        i18n: duplicate
      - { name: order, label: Order, widget: number, value_type: int, i18n: duplicate }

  - name: certifications
    label: Certifications and education
    label_singular: Credential
    folder: src/content/certifications
    extension: json
    format: json
    create: true
    i18n: true
    identifier_field: name
    fields:
      - name: kind
        label: Kind (training is shown as "Course")
        widget: select
        options:
          - certification
          - education
          - training
        i18n: duplicate
      - { name: name, label: Name, widget: string, i18n: true }
      - {
          name: code,
          label: Exam or credential code,
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - { name: issuer, label: Issuer, widget: string, i18n: duplicate }
      - {
          name: year,
          label: Year,
          widget: number,
          value_type: int,
          min: 1000,
          max: 9999,
          i18n: duplicate,
        }
      - name: status
        label: Status
        widget: select
        options:
          - completed
          - in-progress
        default: completed
        required: false
        i18n: duplicate
      - {
          name: credentialUrl,
          label: Credential URL,
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - { name: badge, label: Badge image, widget: image, required: false, i18n: duplicate }
      - { name: order, label: Order, widget: number, value_type: int, i18n: duplicate }
