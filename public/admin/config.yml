# Sveltia CMS configuration. Keep every collection in sync with
# src/lib/content/schemas.ts (guarded by tests/unit/admin/config-parity.test.ts).
backend:
  name: github
  repo: Jhomove/jhomovedev # TODO(autor): confirm owner/repo
  branch: main

media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_folders
  locales: [es, en]
  default_locale: es

collections:
  - name: stack
    label: Stack
    label_singular: Technology
    folder: src/content/stack
    extension: json
    format: json
    create: true
    i18n: false
    fields:
      - { name: name, label: Name, widget: string }
      - name: cluster
        label: Cluster
        widget: select
        options:
          - frontend
          - backend
          - aws-serverless
          - data
          - devops-iac
          - ai
          - languages
          - tools
      - {
          name: years,
          label: Years of experience,
          widget: number,
          value_type: float,
          min: 0,
          required: false,
        }
      - { name: icon, label: Icon key, widget: string, required: false }
      - { name: order, label: Order, widget: number, value_type: int, required: false }
